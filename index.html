  {id:"f2", nombre:"Carlos - Kiosco esquina", telefono:"11-5555-0034", deuda:8400, limite:20000, historial:[]},

];
const SEED_USUARIOS_PLAIN = [
  {user:"dueño", pass:"1234", rol:"dueño", nombre:"Dueño"},
  {user:"maria", pass:"1234", rol:"empleado", nombre:"María"},
  {user:"jorge", pass:"1234", rol:"empleado", nombre:"Jorge"},

// ============ UTILS ============
const fmtMoney = n => "$" + Number(n||0).toLocaleString("es-AR");
const hoyISO = () => new Date().toISOString().split("T")[0];
const loadLS = (k, def) => { try{ const v=localStorage.getItem(k); return v? JSON.parse(v): def; }catch{return def} };
const saveLS = (k, v) => { try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} };
async function hashPass(str){
  try{
    const enc = new TextEncoder().encode(str);
    const buf = await crypto.subtle.digest("SHA-256", enc);
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
  }catch{ return "hash_"+str } // fallback
}
function validarProducto(p, lista, editId){
  const e=[];
  if(!p.nombre || p.nombre.trim().length<3) e.push("Nombre mínimo 3 caracteres");
  if(!p.codigo || !/^[0-9]{6,14}$/.test(p.codigo.trim())) e.push("Código debe ser 6-14 dígitos");
  if(lista.some(x=> x.codigo===p.codigo.trim() && x.id!==editId)) e.push("Código ya existe");
  if(!(p.precio>0)) e.push("Precio debe ser >0");
  if(!(p.costo>=0)) e.push("Costo no puede ser negativo");
  if(p.costo>p.precio) e.push("Costo no puede ser mayor al precio");
  if(!(Number.isInteger(p.stock) && p.stock>=0)) e.push("Stock debe ser entero >=0");
  if(!p.categoria) e.push("Categoría requerida");
  return e;
}

// ============ ICONOS SVG INLINE (sin lucide pesado) ============
const Icon = ({d, size=18}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d={d}/></svg>;

// ============ TOAST ============
function useToast(){
  const [toasts, setToasts] = useState([]);
  const push = (msg, type="ok") => {
    const id=Date.now()+Math.random();
    setToasts(t=> [...t, {id,msg,type}]);
    setTimeout(()=> setToasts(t=> t.filter(x=>x.id!==id)), 3000);
  };
  const ToastContainer = () => (
    <div className="fixed top-4 right-4 z-[100] space-y-2">
      {toasts.map(t=> (
        <div key={t.id} className={`px-4 py-3 rounded-2xl shadow-lg text-sm font-medium border ${t.type==="error"?"bg-red-50 border-red-200 text-red-700": t.type==="warn"?"bg-amber-50 border-amber-200 text-amber-800":"bg-emerald-50 border-emerald-200 text-emerald-800"}`}>{t.msg}</div>
      ))}
    </div>
  );
  return {push, ToastContainer};
}

// ============ APP ============
function App(){
  const {push, ToastContainer} = useToast();

  // --- PERSISTED STATE ---
  const [productos, setProductos] = useState(()=> loadLS("bd_productos", SEED_PRODUCTOS));
  const [ventas, setVentas] = useState(()=> loadLS("bd_ventas", []));
  const [fiados, setFiados] = useState(()=> loadLS("bd_fiados", SEED_FIADOS));
  const [logs, setLogs] = useState(()=> loadLS("bd_logs", []));
  const [usuarios, setUsuarios] = useState(()=> loadLS("bd_usuarios_hash", null) || (()=> {
    // migrar plain -> hash async, mientras tanto plain
    const hashed = loadLS("bd_usuarios", SEED_USUARIOS_PLAIN);
    return hashed;
  })());
  const [cierres, setCierres] = useState(()=> loadLS("bd_cierres", []));
  const [user, setUser] = useState(()=> { try{return localStorage.getItem("bd_user")}catch{return null}});
  const [tab, setTab] = useState("pos");
  const [hora, setHora] = useState(new Date());
  const [estadoNube, setEstadoNube] = useState("local"); // local | conectando | conectado | error
  const firestoreRef = useRef(null);

  // login
  const [loginUser, setLoginUser] = useState("");
  const [loginPass, setLoginPass] = useState("");
  const [showPass, setShowPass] = useState(false);
  const [intentos, setIntentos] = useState(0);
  const [bloqueoHasta, setBloqueoHasta] = useState(null);
  const [segRestantes, setSegRestantes] = useState(0);

  // pos
  const [busqueda, setBusqueda] = useState("");
  const [filtroLetra, setFiltroLetra] = useState("TODAS");
  const [códigoBarras, setCódigoBarras] = useState("");
  const [carrito, setCarrito] = useState([]);
  const [metodoPago, setMetodoPago] = useState("efectivo");
  const [clienteFiado, setClienteFiado] = useState("");
  const [cantidadTeclado, setCantidadTeclado] = useState("1");
  const [showScanner, setShowScanner] = useState(false);
  const videoRef = useRef(null);
  const streamRef = useRef(null);

  // stock modal
  const [prodEdit, setProdEdit] = useState(null);
  const [stockSearch, setStockSearch] = useState("");
  const [stockCat, setStockCat] = useState("TODAS");
  const [stockPag, setStockPag] = useState(0);
  const STOCK_POR_PAG = 8;
  const [margenInput, setMargenInput] = useState("40");
  const [seleccionados, setSeleccionados] = useState(new Set());

  // fiados
  const [cobroModal, setCobroModal] = useState(null); // {id, monto}
  const [clienteEdit, setClienteEdit] = useState(null);

  // seguridad
  const [cambioPassOpen, setCambioPassOpen] = useState(false);
  const [nuevaPass, setNuevaPass] = useState("");
  const [editUserPass, setEditUserPass] = useState(null); // user id
  const [editUserPassVal, setEditUserPassVal] = useState("");

  // cierres ticket
  const [ventaTicket, setVentaTicket] = useState(null);

  const usuarioActual = useMemo(()=> usuarios.find(u=>u.user===user), [user, usuarios]);
  const esDueno = usuarioActual?.rol==="dueño";

  // ====== EFECTOS GENERALES ======
  useEffect(()=>{ const id=setInterval(()=>setHora(new Date()),1000); return()=>clearInterval(id)},[]);
  useEffect(()=>{
    if(bloqueoHasta){
      const id=setInterval(()=>{
        const s=Math.ceil((bloqueoHasta - Date.now())/1000);
        if(s<=0){ setBloqueoHasta(null); setSegRestantes(0); setIntentos(0); clearInterval(id); }
        else setSegRestantes(s);
      },500);
      return()=>clearInterval(id);
    }
  },[bloqueoHasta]);

  // persist
  useEffect(()=>saveLS("bd_productos", productos),[productos]);
  useEffect(()=>saveLS("bd_ventas", ventas),[ventas]);
  useEffect(()=>saveLS("bd_fiados", fiados),[fiados]);
  useEffect(()=>saveLS("bd_logs", logs),[logs]);
  useEffect(()=>saveLS("bd_cierres", cierres),[cierres]);
  // usuarios: guardamos siempre, si tiene hash guardamos hash, sino plain (migración)
  useEffect(()=>{
    // si usuarios tiene pass con longitud 64 (sha256) lo guardamos en bd_usuarios_hash
    const hasHash = usuarios.some(u=> u.pass && u.pass.length===64);
    if(hasHash) saveLS("bd_usuarios_hash", usuarios);
    else saveLS("bd_usuarios", usuarios);
  },[usuarios]);

  // inactividad 15min
  useEffect(()=>{
    if(!user) return;
    let t;
    const reset = () => {
      clearTimeout(t);
      t = setTimeout(()=>{ addLog("Sesión cerrada por inactividad 15min"); setUser(null); try{localStorage.removeItem("bd_user")}catch{}; push("Sesión cerrada por inactividad","warn"); }, 900000);
    };
    const evs=["mousemove","keydown","click","touchstart"];
    evs.forEach(e=> window.addEventListener(e, reset));
    reset();
    return ()=>{ clearTimeout(t); evs.forEach(e=> window.removeEventListener(e, reset)); };
  },[user]);

  // backup auto 5min + a Firestore coleccián backups (si conectado)
  useEffect(()=>{
    const id=setInterval(()=>{ 
      try{ 
        const data={productos, ventas, fiados, fecha:new Date().toISOString()};
        localStorage.setItem("bd_backup_auto", JSON.stringify(data));
        // subir a Firestore si hay conexián
        if(firestoreRef.current && estadoNube==="conectado"){
          const bid="auto_"+hoyISO();
          firestoreRef.current.collection("backups").doc(bid).set({...data, tipo:"auto", fecha: new Date().toISOString()}).catch(()=>{});
        }
      }catch{} 
    }, 300000);
    return()=>clearInterval(id);
  },[productos,ventas,fiados,estadoNube]);

  // Firebase init (compat)
  useEffect(()=>{
    let unsubProd=null, unsubVentas=null, unsubFiados=null;
    let cancelado=false;
    const init = async () => {
      try{
        const ensureFirebase = async () => {
          if(window.firebase && window.firebase.firestore) return window.firebase;
          setEstadoNube("conectando");
          const loadScript = (src)=> new Promise((res,rej)=>{
            const s=document.createElement("script"); s.src=src; s.async=true; s.onload=res; s.onerror=rej; document.head.appendChild(s);
          });
          try{
            await loadScript("https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js");
            await loadScript("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js");
            return window.firebase;
          }catch(e){ throw e; }
        };
        const fb = await ensureFirebase();
        if(cancelado) return;
        try{
          if(fb.apps && fb.apps.length===0) fb.initializeApp(FIREBASE_CONFIG);
          else if(!fb.apps) try{ fb.initializeApp(FIREBASE_CONFIG);}catch{}
        }catch{}
        const db = fb.firestore();
        firestoreRef.current = db;
        // productos
        unsubProd = db.collection("productos").onSnapshot(snap=>{
          if(snap.empty){ setEstadoNube("conectado"); return; }
          const data = snap.docs.map(d=>d.data());
          if(data.length>0) setProductos(data);
          setEstadoNube("conectado");
        }, err=>{ console.warn(err); setEstadoNube("error"); });
        // ventas
        unsubVentas = db.collection("ventas").orderBy("fecha","desc").limit(100).onSnapshot(snap=>{
          const data = snap.docs.map(d=>d.data());
          if(data.length>0){
            setVentas(prev=>{
              const map=new Map();
              [...data, ...prev].forEach(v=> map.set(v.id, v));
              return Array.from(map.values()).sort((a,b)=> b.fecha.localeCompare(a.fecha));
            });
            setEstadoNube("conectado");
          }
        }, err=> console.warn(err));
        // fiados
        unsubFiados = db.collection("clientesFiado").onSnapshot(snap=>{
          const data=snap.docs.map(d=>d.data());
          if(data.length>0) setFiados(data);
          setEstadoNube("conectado");
        }, err=> console.warn(err));
        setTimeout(()=>{ if(!cancelado) setEstadoNube(s=> s==="conectando"?"conectado":s)}, 2500);
      }catch(e){
        console.warn("Firebase no disponible", e);
        setEstadoNube("local");
      }
    };
    init();
    return ()=>{ cancelado=true; try{unsubProd&&unsubProd()}catch{} try{unsubVentas&&unsubVentas()}catch{} try{unsubFiados&&unsubFiados()}catch{} };
  },[]);

  // scanner
  useEffect(()=>{
    if(!showScanner) return;
    let stream=null;
    (async()=>{
      try{
        stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
        streamRef.current=stream;
        if(videoRef.current) videoRef.current.srcObject=stream;
      }catch(e){ console.warn(e); push("No se pudo abrir cámara","error"); setShowScanner(false);}
    })();
    return()=>{ try{ stream?.getTracks().forEach(t=>t.stop()); }catch{} if(streamRef.current){ try{streamRef.current.getTracks().forEach(t=>t.stop())}catch{} } };
  },[showScanner]);

  // helpers firestore save
  const isDev = typeof location!=="undefined" && (location.hostname==="localhost" || location.hostname==="127.0.0.1");
  const logWarn = (...a)=>{ if(isDev) console.warn(...a); };
  const fbSaveProducto = (p)=>{ try{ firestoreRef.current?.collection("productos").doc(p.id).set(p).catch(e=>logWarn(e)); }catch{} };
  const fbSaveVenta = (v)=>{ try{ firestoreRef.current?.collection("ventas").doc(v.id).set(v).catch(e=>logWarn(e)); }catch{} };
  const fbSaveFiado = (f)=>{ try{ firestoreRef.current?.collection("clientesFiado").doc(f.id).set(f).catch(e=>logWarn(e)); }catch{} };
  const fbDeleteProducto = (id)=>{ try{ firestoreRef.current?.collection("productos").doc(id).delete().catch(e=>logWarn(e)); }catch{} };

  const addLog = (accion)=> {
    const entry={fecha:new Date().toISOString(), usuario: user||"sistema", accion};
    setLogs(prev=> [entry, ...prev].slice(0,200));
  };

  // ====== LOGIN CON HASH ======
  const handleLogin = async () => {
    if(bloqueoHasta && Date.now()<bloqueoHasta) return;
    const u = usuarios.find(x=> x.user===loginUser);
    if(!u){ const n=intentos+1; setIntentos(n); if(n>=3){ setBloqueoHasta(Date.now()+30000); setSegRestantes(30);} else push("Usuario o clave incorrecta","error"); return; }
    // soportar plain y hash
    let passOk=false;
    if(u.pass && u.pass.length===64){
      const h=await hashPass(loginPass);
      passOk = h===u.pass;
    }else{
      passOk = u.pass===loginPass;
      // migrar a hash en background si ok
      if(passOk){
        hashPass(loginPass).then(h=>{
          setUsuarios(prev=> prev.map(x=> x.user===u.user? {...x, pass:h}: x));
        });
      }
    }
    if(passOk){
      setUser(u.user);
      try{localStorage.setItem("bd_user", u.user)}catch{}
      addLog(`Login ${u.user}`);
      setIntentos(0);
      push(`Bienvenido ${u.nombre}`);
    }else{
      const n=intentos+1;
      setIntentos(n);
      if(n>=3){ setBloqueoHasta(Date.now()+30000); setSegRestantes(30); }
      else push("Usuario o clave incorrecta","error");
    }
  };

  // ====== POS LOGIC ======
  const productosFiltrados = useMemo(()=>{
    let lst=[...productos];
    if(filtroLetra!=="TODAS") lst=lst.filter(p=> p.nombre.trim().toUpperCase().startsWith(filtroLetra));
    if(busqueda.trim()){
      const q=busqueda.toLowerCase();
      lst=lst.filter(p=> p.nombre.toLowerCase().includes(q) || p.codigo.includes(q) || p.categoria.toLowerCase().includes(q));
    }
    if(stockSearch.trim()){ /* no usar en pos */ }
    // si código exacto, priorizar
    if(códigoBarras.trim()){
      const exact = productos.find(p=> p.codigo===códigoBarras.trim());
      if(exact) return [exact];
    }
    return lst.slice(0,80);
  },[productos, busqueda, filtroLetra, códigoBarras]);

  const totalCarrito = useMemo(()=> carrito.reduce((s,p)=> s + p.precio * p.cantidad, 0),[carrito]);
  const gananciaCarrito = useMemo(()=> carrito.reduce((s,p)=> s + (p.precio - p.costo)* p.cantidad, 0),[carrito]);
  const cantCarrito = useMemo(()=> carrito.reduce((s,p)=> s+p.cantidad,0),[carrito]);

  const agregarAlCarrito = (prod, cantOverride=null) => {
    const cant = cantOverride!==null ? cantOverride : (parseInt(cantidadTeclado)||1);
    if(cant<=0){ push("Cantidad inválida","error"); return; }
    if(cant>999){ push("Cantidad máxima 999","error"); return; }
    const existente = carrito.find(c=>c.id===prod.id);
    const ya = existente? existente.cantidad : 0;
    if(ya + cant > prod.stock){
      push(`Stock insuficiente: ${prod.nombre} tiene ${prod.stock} u. Ya tenés ${ya} en carrito`,"error");
      return;
    }
    setCarrito(prev=>{
      if(prev.find(p=>p.id===prod.id)) return prev.map(p=> p.id===prod.id? {...p, cantidad: p.cantidad + cant}: p);
      return [...prev, {...prod, cantidad: cant}];
    });
    push(`${prod.nombre} x${cant} agregado`);
  };

  const handleCódigoOk = () => {
    const code=códigoBarras.trim();
    if(!code) return;
    const prod = productos.find(p=> p.codigo===code || p.id===code);
    if(prod){ agregarAlCarrito(prod); setCódigoBarras(""); }
    else{
      // búsqueda difusa por nombre
      const q=code.toLowerCase();
      const cand = productos.find(p=> p.nombre.toLowerCase().includes(q));
      if(cand){ agregarAlCarrito(cand); setCódigoBarras(""); }
      else push("Código no encontrado","error");
    }
  };

  const cobrar = () => {
    if(carrito.length===0) return;
    if(metodoPago==="fiado" && !clienteFiado){ push("Seleccion? cliente fiado","error"); return; }
    // validar stock nuevamente
    for(const item of carrito){
      const prod = productos.find(p=>p.id===item.id);
      if(!prod || item.cantidad > prod.stock){
        push(`Stock insuficiente para ${item.nombre}`,"error");
        return;
      }
    }
    // validar límite fiado
    if(metodoPago==="fiado"){
      const cli = fiados.find(f=> f.id===clienteFiado);
      if(cli && cli.deuda + totalCarrito > cli.limite){
        push(`${cli.nombre} supera limite ${fmtMoney(cli.deuda+totalCarrito)} / Limite ${fmtMoney(cli.limite)} - bloqueado`, "error"); return;
      }
    }
    const id=Date.now().toString();
    const now=new Date();
    const venta={
      id,
      fecha: hoyISO(),
      hora: now.toLocaleTimeString("es-AR",{hour:"2-digit", minute:"2-digit"}),
      timestamp: now.toISOString(),
      items:[...carrito],
      total: totalCarrito,
      ganancia: gananciaCarrito,
      usuario: user||"anon",
      metodo: metodoPago,
      clienteFiado: metodoPago==="fiado"? clienteFiado: null
    };
    setVentas(prev=> [venta, ...prev]);
    fbSaveVenta(venta);
    // descontar stock
    setProductos(prev=> prev.map(p=>{
      const it=carrito.find(c=>c.id===p.id);
      if(it){
        const np={...p, stock: Math.max(0, p.stock - it.cantidad)};
        fbSaveProducto(np);
        return np;
      }
      return p;
    }));
    // si fiado actualizar deuda
    if(metodoPago==="fiado" && clienteFiado){
      setFiados(prev=> prev.map(f=>{
        if(f.id===clienteFiado){
          const nf={...f, deuda: f.deuda + totalCarrito, historial: [...f.historial, {fecha: now.toISOString(), tipo:"compra", monto: totalCarrito, desc:`Venta ${id} - ${carrito.map(c=>c.nombre.slice(0,12)).join(", ")}`}]};

                    if(!confirm("áResetear datos de DEMO? Mantiene usuarios.")) return;
                    setProductos(SEED_PRODUCTOS); setVentas([]); setFiados(SEED_FIADOS); setCierres([]); push("Datos reseteados a demo");
                  }} className="h-11 px-5 rounded-2xl bg-amber-50 border border-amber-200 text-amber-700 font-bold text-sm">? Reset Demo</button>
                </div>
                <div className="mt-4 p-3 rounded-2xl bg-gray-900 text-green-300 font-mono text-[11px] overflow-auto">
                  <div>// Firebase config</div>
                  <div>projectId: {FIREBASE_CONFIG.projectId}</div>
                  <div>status: {estadoNube}</div>
                  <div>window.firebase: {typeof window!=="undefined" && window.firebase? "cargado ?":"no cargado - modo local"}</div>
                  <div>hash pass: SHA-256 (Web Crypto)</div>
                  <div>validaciones: stock, límite fiado, código ánico</div>
                </div>
              </div>
            </div>
          )}
        </main>
      </div>

      {/* TICKET MODAL */}
      {ventaTicket && (
        <div className="fixed inset-0 bg-black/50 z-[60] flex items-center justify-center p-4 no-print">
          <div className="bg-white rounded-[20px] p-5 w-full max-w-[380px] shadow-xl">
            <div className="text-center border-b pb-3 mb-3">
              <div className="font-black">ALMACáN BUEN DáA</div>
              <div className="text-xs text-gray-500">Ticket • {ventaTicket.fecha} {ventaTicket.hora} • {ventaTicket.usuario}</div>
              <div className="text-[11px] font-mono">#{ventaTicket.id.slice(-6)} • {ventaTicket.metodo.toUpperCase()} {ventaTicket.clienteFiado? "? Fiado":""}</div>
            </div>
            <div className="space-y-1 text-sm">
              {ventaTicket.items.map(it=> (
                <div key={it.id} className="flex justify-between"><span>{it.cantidad}x {it.nombre.slice(0,22)}</span><span className="font-bold">{fmtMoney(it.precio*it.cantidad)}</span></div>
              ))}
              {ventaTicket.esPagoFiado && <div className="text-xs text-blue-600">Pago de deuda fiado</div>}
            </div>
            <div className="border-t mt-3 pt-3 flex justify-between font-black text-lg">TOTAL <span>{fmtMoney(ventaTicket.total)}</span></div>
            <div className="mt-4 flex gap-2 no-print">
              <button onClick={()=>setVentaTicket(null)} className="flex-1 h-10 rounded-2xl bg-gray-100 font-semibold">Cerrar</button>
              <button onClick={()=>window.print()} className="flex-1 h-10 rounded-2xl bg-indigo-600 text-white font-bold">🕐? Imprimir</button>
            </div>
            <div className="hidden print:block text-center text-[11px] mt-4">áGracias por su compra!</div>
          </div>
        </div>
      )}

      <style>{`@import url('https://fonts.googleapis.com/css2áfamily=Inter:wght@400;500;700;800;900&display=swap');`}</style>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
</body>
</html>
